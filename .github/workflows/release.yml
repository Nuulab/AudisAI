name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build CLI binaries
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%d)
          LDFLAGS="-X 'github.com/nuulab/audisai/cmd.Version=${VERSION}' -X 'github.com/nuulab/audisai/cmd.Commit=${COMMIT}' -X 'github.com/nuulab/audisai/cmd.Date=${DATE}'"
          
          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o audisai-linux-amd64 main.go
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o audisai-linux-arm64 main.go
          
          # macOS
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o audisai-darwin-amd64 main.go
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o audisai-darwin-arm64 main.go
          
          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o audisai-windows-amd64.exe main.go

      - name: Upload CLI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: |
            audisai-linux-amd64
            audisai-linux-arm64
            audisai-darwin-amd64
            audisai-darwin-arm64
            audisai-windows-amd64.exe

  build-gui:
    name: Build GUI
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build GUI
        working-directory: ./gui
        shell: bash
        run: |
          VERSION=${{ needs.build-cli.outputs.VERSION }}
          # Fallback if needs output is empty (e.g. if we restructure)
          if [ -z "$VERSION" ]; then VERSION=${GITHUB_REF#refs/tags/}; fi
          
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%d)
          LDFLAGS="-X 'github.com/nuulab/audisai/cmd.Version=${VERSION}' -X 'github.com/nuulab/audisai/cmd.Commit=${COMMIT}' -X 'github.com/nuulab/audisai/cmd.Date=${DATE}'"
          
          wails build -ldflags "$LDFLAGS" -platform ${{ matrix.os == 'windows-latest' && 'windows/amd64' || matrix.os == 'macos-latest' && 'darwin/universal' || 'linux/amd64' }}

      - name: Rename GUI Binary (Linux)
        if: runner.os == 'Linux'
        run: mv gui/build/bin/AudisAI gui/build/bin/AudisAI-GUI-linux-amd64

      - name: Rename GUI Binary (Windows)
        if: runner.os == 'Windows'
        run: mv gui/build/bin/AudisAI.exe gui/build/bin/AudisAI-GUI-windows-amd64.exe

      - name: Compress GUI App (macOS)
        if: runner.os == 'macOS'
        run: |
          cd gui/build/bin
          tar -czf AudisAI-GUI-macos-universal.tar.gz AudisAI.app

      - name: Upload GUI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-binaries-${{ matrix.os }}
          path: |
            gui/build/bin/AudisAI-GUI-linux-amd64
            gui/build/bin/AudisAI-GUI-windows-amd64.exe
            gui/build/bin/AudisAI-GUI-macos-universal.tar.gz

  release:
    needs: [build-cli, build-gui]
    runs-on: ubuntu-latest
    steps:
      - name: Download CLI Artifacts
        uses: actions/download-artifact@v4
        with:
          name: cli-binaries

      - name: Download GUI Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: gui-binaries-ubuntu-latest
          path: gui-linux

      - name: Download GUI Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: gui-binaries-windows-latest
          path: gui-windows

      - name: Download GUI macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: gui-binaries-macos-latest
          path: gui-macos

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            audisai-linux-amd64
            audisai-linux-arm64
            audisai-darwin-amd64
            audisai-darwin-arm64
            audisai-windows-amd64.exe
            gui-linux/AudisAI-GUI-linux-amd64
            gui-windows/AudisAI-GUI-windows-amd64.exe
            gui-macos/AudisAI-GUI-macos-universal.tar.gz
          generate_release_notes: true
